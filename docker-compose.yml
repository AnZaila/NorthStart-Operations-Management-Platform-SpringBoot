services:
  mysql:
    image: mysql:8.4
    container_name: northstar-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: northstar
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --explicit_defaults_for_timestamp=1
    volumes:
      - northstar-mysql:/var/lib/mysql

volumes:
  northstar-mysql:
