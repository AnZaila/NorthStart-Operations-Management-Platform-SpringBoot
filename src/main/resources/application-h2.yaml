# 本地零依赖启动（默认）。H2 兼容 MySQL 语法，数据文件在 ./data
spring:
  datasource:
    url: jdbc:h2:file:./data/northstar;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
